services:
  - type: web
    name: skillbridge-api
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillbridge-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
    healthCheckPath: /api/health

  - type: web
    name: skillbridge-frontend
    runtime: static
    rootDir: .
    buildCommand: ""
    staticPublishPath: .
    plan: free
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

databases:
  - name: skillbridge-db
    plan: free
    databaseName: skillbridge
    user: skillbridge
