services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillbridge
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: skillbridge
    ports:
      - "5432:5432"
    volumes:
      - skillbridge_pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://skillbridge:skillbridge@db:5432/skillbridge
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  skillbridge_pgdata:
